server {
 listen 80;
 root /usr/share/nginx/html;

 # OHIF uses SharedArrayBuffer inside the same-origin iframe.
 add_header Cross-Origin-Opener-Policy same-origin always;
 add_header Cross-Origin-Embedder-Policy require-corp always;
 proxy_hide_header Cross-Origin-Opener-Policy;
 proxy_hide_header Cross-Origin-Embedder-Policy;

 location /api/ { proxy_pass http://api:8000/; }
 location /dicom-web/ { proxy_pass http://orthanc:8042; }
 location /viewer/ { proxy_pass http://ohif/; }

 # The prebuilt OHIF image requests bundles, workers and config from /.
 # Serve worklist files locally and forward other paths to OHIF.
 location / { try_files $uri $uri/ @ohif; }
 location @ohif { proxy_pass http://ohif; }
}
